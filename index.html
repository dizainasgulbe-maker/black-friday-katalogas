<style>
/* Layout: one full-height stage holding a canvas book (two pages, or one on narrow screens) with a paper-curl page turn; slim control bar below. Committed dark look to match the black-and-gold catalogue. */
:root {
  --stage-a: #211f24;
  --stage-b: #0a0a0b;
  --gold: #d6ae5c;
  --gold-dim: #7d6738;
  --fg: #ece6d8;
  --muted: #9b9482;

  --shift: 1150ms;
  color-scheme: dark;

html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--stage-b);
  background-image: radial-gradient(ellipse at 50% 42%, var(--stage-a), var(--stage-b) 72%);
  color: var(--fg);
  font: 400 14px/1.4 var(--font-ui);
}
.stage {
  flex: 1 1 0;
  min-height: 0;
  display: grid;
  place-items: center;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.book {
  position: relative;
  transition: transform var(--shift) cubic-bezier(.4, .1, .2, 1);
}
.book canvas { display: block; cursor: pointer; }
.links { position: absolute; inset: 0; pointer-events: none; }
.hot {

  border-radius: 999px;
  pointer-events: auto;
  cursor: pointer;
  transition: box-shadow .2s ease;
}
.hot:hover, .hot:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--gold), 0 0 20px rgba(214, 174, 92, .55);
}
.bar {
  flex: none;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding-block: 8px 12px;
}
.bar .note { color: var(--muted); font-size: 13px; letter-spacing: .02em; min-width: 0; }
.bar .controls { display: flex; align-items: center; gap: 14px; }
.bar .right { display: flex; justify-content: flex-end; }
.count { min-width: 6.5em; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .04em; color: var(--fg); }
.btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--gold-dim);
  background: rgba(255, 255, 255, .03);
  color: var(--gold);
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;

.btn:hover:not(:disabled) { background: rgba(214, 174, 92, .14); border-color: var(--gold); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: .3; cursor: default; }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  .bar { grid-template-columns: 1fr; justify-items: center; }
  .bar .note, .bar .right { display: none; }
}
@media (prefers-reduced-motion: reduce) { :root { --shift: 10ms; } }

</nav>

      var j = z === 'R' ? cur : cur - 1, rest = z === 'R' ? 0 : PI;
      if (!turn || turn.j !== j) turn = { j: j, theta: rest, rest: rest };
      dragging = { z: z, x: e.clientX, y: e.clientY, moved: false };
      links.innerHTML = '';
      stage.style.cursor = 'grabbing';
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    } else {
      swipe = { x: e.clientX, y: e.clientY };
    }
  });

  stage.addEventListener('pointermove', function (e) {
    var p = bookPos(e);
    if (dragging) {
      if (Math.abs(e.clientX - dragging.x) + Math.abs(e.clientY - dragging.y) > 6) {
        if (!dragging.moved) setShift(dragging.z === 'R' ? cur + 1 : cur - 1);
        dragging.moved = true;
      }
      if (dragging.moved) { turn.theta = angleAt(p); draw(); }
      return;
    }
    if (e.pointerType !== 'mouse' || (anim && anim.full)) return;
    var z = zoneAt(p);
    if (z !== hoverZone) {
      hoverZone = z;
      stopIntro();
      stage.style.cursor = z ? 'grab' : '';
      if (z) startPeek(z); else endPeek();
    }
  });

  function finishDrag(cancelled) {
    var d = dragging;
    if (!d) return;
    dragging = null;
    stage.style.cursor = '';
    lastDragAt = Date.now();
    if (!d.moved) {
      turn = null; draw();
      if (!cancelled) step(d.z === 'R' ? 1 : -1);
      return;
    }
    var fwd = d.z === 'R', th = turn.theta;
    var complete = fwd ? th > 1.1 : th < PI - 1.1;
    var target = complete ? (fwd ? cur + 1 : cur - 1) : cur;
    var end = complete ? (fwd ? PI : 0) : turn.rest;
    setShift(target);
    var dur = 250 + 650 * Math.abs(end - th) / PI;
    animTheta(end, dur, function () { if (complete) commit(target); else { turn = null; hoverZone = null; draw(); ui(); } }, true);
  }
  stage.addEventListener('pointerup', function (e) {
    if (dragging) { finishDrag(false); return; }
    if (swipe) {
      var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      swipe = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { lastDragAt = Date.now(); step(dx < 0 ? 1 : -1); }
    }
  });
  stage.addEventListener('pointercancel', function () { swipe = null; finishDrag(true); });
  stage.addEventListener('pointerleave', function () {
    if (hoverZone && !dragging) { hoverZone = null; stage.style.cursor = ''; endPeek(); }
  });

  stage.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    if (Date.now() - lastDragAt < 400) return;
    var r = cv.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    if (mode === 'double') step(e.clientX < r.left + r.width / 2 ? -1 : 1);
    else step(e.clientX < r.left + r.width * 0.3 ? -1 : 1);
  });

  prevBtn.addEventListener('click', function () { step(-1); });
  nextBtn.addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') { e.preventDefault(); jump(0); }
    else if (e.key === 'End') { e.preventDefault(); jump(maxJ); }
  });

  if (document.fullscreenEnabled) {
    fullBtn.hidden = false;
    fullBtn.addEventListener('click', function () {
      try {
        var pr = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if (pr && pr.catch) pr.catch(function () {});
      } catch (err) {}
    });
  }

  /* opening peek: the cover corner lifts once, then settles */
  function intro() {
    introTimer = 0;
    if (introDone || reduce || mode !== 'double' || cur !== 0 || turn || isBusy()) return;
    introDone = true;
    turn = { j: 0, theta: 0, rest: 0 };
    animTheta(0.62, 800, function () {
      introTimer = setTimeout(function () {
        introTimer = 0;
        if (turn && turn.j === 0 && !isBusy() && !hoverZone) animTheta(0, 650, function () { turn = null; draw(); }, false);
      }, 450);
    }, false);
  }

  function layout() {
    var r = stage.getBoundingClientRect();
    var aw = Math.max(0, r.width - 8), ah = Math.max(0, r.height - 8);
    if (aw < 50 || ah < 50) return;
    var m = aw / ah < 1.2 ? 'single' : 'double';
    var p = m === 'single' ? Math.min(aw, ah * RATIO) : Math.min(aw / 2, ah * RATIO);
    pw = Math.floor(p); H = Math.floor(pw / RATIO);
    W = m === 'single' ? pw : pw * 2;
    sx = m === 'single' ? 0 : pw;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    if (m !== mode) {
      var pageNo = mode === null ? 1 : (mode === 'double' ? Math.min(N, 2 * cur + 1) : cur + 1);
      cancelAnim(); turn = null; dragging = null; hoverZone = null;
      mode = m;
      maxJ = m === 'double' ? 12 : N - 1;
      cur = m === 'double' ? Math.min(12, Math.floor(pageNo / 2)) : pageNo - 1;
    }
    book.style.width = W + 'px';
    book.style.height = H + 'px';
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    setShift(turn ? (turn.theta > PI / 2 ? turn.j + 1 : turn.j) : cur);
    draw(); ui();
    if (!introDone && !introTimer && mode === 'double') introTimer = setTimeout(intro, 1100);
  }

  var pending = false;
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; layout(); });
  }
  if (window.ResizeObserver) new ResizeObserver(schedule).observe(stage);
  window.addEventListener('resize', schedule);
  schedule();
})();
</script>
</body>
</html>
